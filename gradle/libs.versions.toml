compile-sdk = "36"
min-sdk = "23"
target-sdk = "36"

coroutines = "1.4.2"
junit = "4.13.1"
androidx-test-runner = "1.0.2"
espresso = "3.0.2"
material = "1.2.1"
androidx-core = "1.3.2"
androidx-activity = "1.2.0"
